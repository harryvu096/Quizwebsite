name: Build Bolty APK

on:
  push:
    branches: [ "arena/138b2864-quizwebsite" ]
    paths:
      - "boltys-puzzle-park/**"
      - ".github/workflows/build-boltys-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: boltys-puzzle-park
        run: npm install

      - name: Add Android platform
        working-directory: boltys-puzzle-park
        run: |
          npx cap add android || true
          ls -la
          cat capacitor.config.json

      - name: Sync Capacitor
        working-directory: boltys-puzzle-park
        run: |
          npx cap sync --verbose || npx cap sync
          ls -la android/app/src/main/assets/ 2>&1 | head -n 20

      - name: Build Debug APK
        working-directory: boltys-puzzle-park/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltysPuzzlePark-debug-APK
          path: boltys-puzzle-park/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release AAB (Play Store)
        working-directory: boltys-puzzle-park/android
        run: ./gradlew bundleRelease
        continue-on-error: true

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoltysPuzzlePark-release-AAB
          path: boltys-puzzle-park/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build Standalone HTML
        run: |
          ls -lh boltys-puzzle-park/index.html
          echo "Standalone ready at boltys-puzzle-park/index.html"
