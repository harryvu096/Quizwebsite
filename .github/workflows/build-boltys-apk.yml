name: Build Bolty APK

on:
  push:
    branches: [ "arena/138b2864-quizwebsite" ]
    paths:
      - "boltys-puzzle-park/**"
      - ".github/workflows/build-boltys-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy web assets to Android
        run: |
          mkdir -p boltys-puzzle-park/android/app/src/main/assets/public
          cp boltys-puzzle-park/index.html boltys-puzzle-park/android/app/src/main/assets/public/
          cp -r boltys-puzzle-park/css boltys-puzzle-park/android/app/src/main/assets/public/ || true
          cp -r boltys-puzzle-park/js boltys-puzzle-park/android/app/src/main/assets/public/ || true
          cp -r boltys-puzzle-park/data boltys-puzzle-park/android/app/src/main/assets/public/ || true
          cp -r boltys-puzzle-park/assets boltys-puzzle-park/android/app/src/main/assets/public/ || true
          cp boltys-puzzle-park/manifest.webmanifest boltys-puzzle-park/android/app/src/main/assets/public/ || true
          ls -lh boltys-puzzle-park/android/app/src/main/assets/public/ | head -n 40
          echo "assets copied"

      - name: Build Debug APK with Gradle
        working-directory: boltys-puzzle-park/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltysPuzzlePark-debug-APK
          path: boltys-puzzle-park/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release AAB (Play Store)
        working-directory: boltys-puzzle-park/android
        run: gradle bundleRelease --stacktrace
        continue-on-error: true

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoltysPuzzlePark-release-AAB
          path: boltys-puzzle-park/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
